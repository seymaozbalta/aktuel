name: Aktüel Toplayıcı

on:
  # GitHub Actions cron'u HER ZAMAN UTC calisir.
  # Turkiye UTC+3 ve yaz saati uygulamiyor, yani fark sabit 3 saat.
  # 04:00 UTC = 07:00 TSI
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Her market AYRI bir is olarak calisir.
    #  - fail-fast: false -> SOK patlarsa BIM yine calismaya devam eder.
    #    Tek iste olsalardi biri digerini de dusururdu.
    #  - Her marketin kendi saglik esigi var: BIM'in haftalik katalogu ~75
    #    urun, SOK'un 8 kategorisi yuzlerce urun.
    #  - Hata e-postasinda hangi marketin bozuldugu dogrudan gorunur.
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: bim
            min_products: 40
          - store: sok
            min_products: 1000

    # Ayni market icin iki calistirma ust uste binmesin
    concurrency:
      group: scraper-${{ matrix.store }}
      cancel-in-progress: false

    name: ${{ matrix.store }}

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Bagimliliklari yukle
        run: pip install -r requirements.txt

      - name: Toplayiciyi calistir
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SAVE_RAW_HTML: "1"
        run: >
          python -m src.main
          --store ${{ matrix.store }}
          --min-products ${{ matrix.min_products }}

      - name: Hata halinde ham HTML'i sakla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ham-html-${{ matrix.store }}-${{ github.run_id }}
          path: data/raw/
          retention-days: 7
